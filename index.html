<div id="FX_ROOT_RADIO" style="width:100%;height:100%;position:relative;overflow:hidden;box-sizing:border-box;">
<style>
#FX_ROOT_RADIO { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; display: flex; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box; user-select: none; }
#FX_ROOT_RADIO * { box-sizing: border-box; }
#FX_ROOT_RADIO .rsg-panel { width: 250px; flex: 0 0 250px; background: #141416; padding: 10px; border-right: 1px solid #ff0033; overflow-y: auto; }
#FX_ROOT_RADIO h2 { color: #ff0033; font-size: 13px; text-transform: uppercase; text-align: center; margin: 0 0 8px; }
#FX_ROOT_RADIO label { display: block; font-size: 10px; font-weight: bold; margin: 4px 0 2px; color: #8a8a8a; text-transform: uppercase; }
#FX_ROOT_RADIO input[type=text], #FX_ROOT_RADIO input[type=number] { width: 100%; background: #000; border: 1px solid #2c2c2c; color: #fff; padding: 4px 6px; margin-bottom: 4px; border-radius: 3px; font-size: 11px; }
#FX_ROOT_RADIO input:focus { border-color: #ff0033; outline: none; }
#FX_ROOT_RADIO input[type=checkbox] { margin: 0 6px 0 0; cursor: pointer; }
#FX_ROOT_RADIO input[type=range] { width: 100%; accent-color: #ff0033; margin-bottom: 6px; }
#FX_ROOT_RADIO .section-title { color: #ffcc00; font-size: 10px; text-transform: uppercase; font-weight: bold; margin: 10px 0 4px; border-top: 1px solid #222; padding-top: 6px; }
#FX_ROOT_RADIO .red { color: #ff3333; }
#FX_ROOT_RADIO .blue { color: #00bfff; }
#FX_ROOT_RADIO .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

#FX_ROOT_RADIO .rsg-viewport { flex: 1; display: flex; justify-content: center; align-items: center; background: #050505; position: relative; }
#FX_ROOT_RADIO .radio { position: relative; width: min(600px, 90%); aspect-ratio: 3/2; background: #0a0a0a; border: 1px dashed #333; overflow: hidden; }

#FX_ROOT_RADIO #body { position: absolute; inset: 0; background-size: contain; background-repeat: no-repeat; background-position: center; pointer-events: none; z-index: 1; }
#FX_ROOT_RADIO #arrow { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: top center; pointer-events: none; z-index: 2; }

#FX_ROOT_RADIO .knob {
  position: absolute;
  border-radius: 50%;
  z-index: 10;
  cursor: grab;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: transparent;
  touch-action: none;
}
#FX_ROOT_RADIO .knob:active { cursor: grabbing; }

#FX_ROOT_RADIO .neon-glow-knob {
  box-shadow: 0 0 10px #00e5ff, inset 0 0 5px #00e5ff;
}

#FX_ROOT_RADIO #power-indicator {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 4px 8px;
  font-size: 10px;
  font-weight: bold;
  background: #333;
  color: #888;
  border-radius: 3px;
  z-index: 20;
}
#FX_ROOT_RADIO #power-indicator.on { background: #00c853; color: #fff; }

#FX_ROOT_RADIO #status { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(0,0,0,.7); padding: 6px 12px; font-size: 11px; color: #888; display: flex; justify-content: space-between; }
#FX_ROOT_RADIO #freq { color: #00e676; font-weight: bold; }
</style>

<div class="rsg-panel">
  <h2>Мастер Радио</h2>

  <label>URL Корпуса</label><input type="text" id="bodyUrl" value="https://img.genially.com/666ae277f4d3370">
  <label>URL Стрелки</label><input type="text" id="arrowUrl" value="https://img.genially.com/666ae277f4d3370">
  <label>URL Ручек</label><input type="text" id="knobsUrl" value="">

  <div class="section-title">1. Калибровка стрелки</div>
  <div class="grid">
    <div><label>Базовый X (%)</label><input type="number" id="posX" value="35.3" step=".1"></div>
    <div><label>Базовый Y (%)</label><input type="number" id="posY" value="63" step=".1"></div>
    <div><label>Ширина (px)</label><input type="number" id="size" value="27"></div>
    <div><label>Высота (px)</label><input type="number" id="arrowHeight" value="45"></div>
    <div><label>Мин. значение</label><input type="number" id="minX" value="56"></div>
    <div><label>Макс. значение</label><input type="number" id="maxX" value="280"></div>
  </div>

  <label>Тест положения: <span id="testLabel">56</span></label>
  <input type="range" id="testRot" min="56" max="280" value="56">

  <div class="section-title red">2. Левая ручка (ВКЛ / Трек 1)</div>
  <div class="grid">
    <div><label>X (%)</label><input type="number" id="knobSmallX" value="31" step=".1"></div>
    <div><label>Y (%)</label><input type="number" id="knobSmallY" value="64.2" step=".1"></div>
  </div>
  <label>Размер (px)</label><input type="number" id="knobSmallSize" value="36">

  <div class="section-title blue">3. Правая ручка (Настройка частоты)</div>
  <div class="grid">
    <div><label>X (%)</label><input type="number" id="knobBigX" value="67.5" step=".1"></div>
    <div><label>Y (%)</label><input type="number" id="knobBigY" value="64.1" step=".1"></div>
  </div>
  <label>Размер (px)</label><input type="number" id="knobBigSize" value="36">

  <div class="section-title">4. Звуковые файлы (Прямые ссылки)</div>
  <label>Фоновый трек 1 (MP3)</label><input type="text" id="noiseFile" value="1.mp3">
  <label>Целевой трек 2 (MP3)</label><input type="text" id="signalFile" value="2.mp3">
  <label>Порог переключения</label><input type="number" id="targetAngle" value="230">
</div>

<div class="rsg-viewport">
  <div class="radio" id="radio">
    <div id="power-indicator">ВЫКЛ (Кликните левую ручку)</div>
    <div id="body"></div>
    <div id="arrow"></div>
    <div id="volume" class="knob"></div>
    <div id="tuning" class="knob"></div>
    <div id="status">
      <span>ЧАСТОТА: <b id="freq">56</b></span>
    </div>
  </div>
</div>

<audio id="noiseAudio" loop preload="auto"></audio>
<audio id="signalAudio" loop preload="auto"></audio>

<script>
(function(){
'use strict';
const ROOT = document.getElementById('FX_ROOT_RADIO');
const $ = id => ROOT.querySelector('#' + id);

let currentPos = 56;
let tuningAngle = 0;
let volumeAngle = 0;
let activeDrag = null;
let isPowerOn = false;

const noiseAudio = $('noiseAudio');
const signalAudio = $('signalAudio');

function updateImages(){
  const b = $('bodyUrl').value.trim();
  const a = $('arrowUrl').value.trim();
  const k = $('knobsUrl').value.trim();

  $('body').style.backgroundImage = b ? `url("${b}")` : 'none';
  $('arrow').style.backgroundImage = a ? `url("${a}")` : 'none';
  
  ['tuning', 'volume'].forEach(id => {
    const el = $(id);
    if(k) {
      el.style.backgroundImage = `url("${k}")`;
      el.style.border = 'none';
    } else {
      el.style.backgroundImage = 'none';
      el.style.border = '1px dashed #00e5ff';
    }
  });
}

function updatePositions(){
  const box = $('radio');
  const W = box.clientWidth;
  const H = box.clientHeight;

  const ax = (parseFloat($('posX').value) / 100) * W;
  const ay = (parseFloat($('posY').value) / 100) * H;
  $('arrow').style.left = ax + 'px';
  $('arrow').style.top = ay + 'px';
  $('arrow').style.width = (parseFloat($('size').value) || 27) + 'px';
  $('arrow').style.height = (parseFloat($('arrowHeight').value) || 45) + 'px';

  setKnobLayout($('volume'), $('knobSmallX'), $('knobSmallY'), $('knobSmallSize'), W, H);
  setKnobLayout($('tuning'), $('knobBigX'), $('knobBigY'), $('knobBigSize'), W, H);

  render();
}

function setKnobLayout(el, inputX, inputY, inputSize, W, H){
  const s = parseFloat(inputSize.value) || 36;
  const x = (parseFloat(inputX.value) / 100) * W - s / 2;
  const y = (parseFloat(inputY.value) / 100) * H - s / 2;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = s + 'px';
  el.style.height = s + 'px';
}

function togglePower(){
  isPowerOn = !isPowerOn;
  const ind = $('power-indicator');
  
  if(isPowerOn){
    ind.textContent = 'ВКЛ';
    ind.classList.add('on');
    noiseAudio.src = $('noiseFile').value.trim();
    signalAudio.src = $('signalFile').value.trim();
    
    // Снятие блокировки Autoplay браузера
    noiseAudio.play().catch(e => console.log('Ошибка воспроизведения трека 1:', e));
    signalAudio.play().then(() => {
      if(currentPos < parseFloat($('targetAngle').value)) signalAudio.pause();
    }).catch(e => console.log('Ошибка воспроизведения трека 2:', e));
  } else {
    ind.textContent = 'ВЫКЛ (Кликните левую ручку)';
    ind.classList.remove('on');
    noiseAudio.pause();
    signalAudio.pause();
  }
  updateAudioLogic();
}

function updateAudioLogic(){
  if(!isPowerOn) return;
  const target = parseFloat($('targetAngle').value) || 230;

  if(currentPos >= target){
    noiseAudio.pause();
    if(signalAudio.paused) signalAudio.play().catch(()=>{});
  } else {
    signalAudio.pause();
    if(noiseAudio.paused) noiseAudio.play().catch(()=>{});
  }
}

function render(){
  const min = parseFloat($('minX').value) || 56;
  const max = parseFloat($('maxX').value) || 280;
  
  currentPos = Math.max(min, Math.min(max, currentPos));

  const W = $('radio').clientWidth;
  const travelPx = ((max - min) / 300) * W;
  const ratio = (currentPos - min) / (max - min || 1);
  const shiftX = ratio * travelPx;

  $('arrow').style.transform = `translateX(${shiftX}px)`;
  $('tuning').style.transform = `rotate(${tuningAngle}deg)`;
  $('volume').style.transform = `rotate(${volumeAngle}deg)`;

  $('testRot').min = min;
  $('testRot').max = max;
  $('testRot').value = currentPos;
  $('testLabel').textContent = Math.round(currentPos);
  $('freq').textContent = Math.round(currentPos);

  updateAudioLogic();
}

function getAngle(e, el){
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
  return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
}

function startDrag(e, type){
  e.preventDefault();
  const el = $(type);
  activeDrag = {
    type: type,
    el: el,
    startAngle: getAngle(e, el),
    moved: false
  };
}

function moveDrag(e){
  if(!activeDrag) return;
  e.preventDefault();
  
  const currentAngle = getAngle(e, activeDrag.el);
  let delta = currentAngle - activeDrag.startAngle;
  
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;

  if(Math.abs(delta) > 2) activeDrag.moved = true;

  if(activeDrag.type === 'tuning'){
    tuningAngle += delta;
    activeDrag.startAngle = currentAngle;
    currentPos += delta * 0.4;
  } else {
    volumeAngle += delta;
    activeDrag.startAngle = currentAngle;
  }
  
  render();
}

function stopDrag(){ 
  if(activeDrag && activeDrag.type === 'volume' && !activeDrag.moved){
    togglePower();
  }
  activeDrag = null; 
}

$('tuning').addEventListener('mousedown', e => startDrag(e, 'tuning'));
$('volume').addEventListener('mousedown', e => startDrag(e, 'volume'));
$('tuning').addEventListener('touchstart', e => startDrag(e, 'tuning'), {passive: false});
$('volume').addEventListener('touchstart', e => startDrag(e, 'volume'), {passive: false});

window.addEventListener('mousemove', moveDrag);
window.addEventListener('touchmove', moveDrag, {passive: false});
window.addEventListener('mouseup', stopDrag);
window.addEventListener('touchend', stopDrag);

ROOT.querySelectorAll('input').forEach(input => {
  input.addEventListener('input', () => { updateImages(); updatePositions(); });
});

window.addEventListener('resize', updatePositions);
updateImages();
updatePositions();
})();
</script>
</div>
