<div id="FX_ROOT_RADIO" style="width:100%;height:100%;position:relative;overflow:hidden;box-sizing:border-box;">
<style>
#FX_ROOT_RADIO{font-family:Arial,sans-serif;background:#1a1a1a;color:#fff;display:flex;width:100%;height:100%;overflow:hidden;box-sizing:border-box}
#FX_ROOT_RADIO *{box-sizing:border-box}
#FX_ROOT_RADIO .rsg-panel{width:380px;flex:0 0 380px;background:#141416;padding:20px;border-right:2px solid #ff0033;overflow-y:auto}
#FX_ROOT_RADIO h2{color:#ff0033;font-size:18px;text-transform:uppercase;text-align:center;margin:0 0 15px;letter-spacing:1px}
#FX_ROOT_RADIO label{display:block;font-size:11px;font-weight:bold;margin:0 0 5px;color:#8a8a8a;text-transform:uppercase}
#FX_ROOT_RADIO input[type=text],#FX_ROOT_RADIO input[type=number]{width:100%;background:#000;border:1px solid #2c2c2c;color:#fff;padding:10px;margin-bottom:12px;border-radius:4px}
#FX_ROOT_RADIO input:focus{border-color:#ff0033;outline:none}
#FX_ROOT_RADIO input[type=checkbox]{margin:0 8px 12px 0;transform:scale(1.2);cursor:pointer}
#FX_ROOT_RADIO input[type=range]{width:100%;accent-color:#ff0033;margin-bottom:12px}
#FX_ROOT_RADIO .section-title{color:#ffcc00;font-size:12px;text-transform:uppercase;font-weight:bold;margin:15px 0 10px}
#FX_ROOT_RADIO .blue{color:#00bfff}.red{color:#ff3333}.green{color:#00e676}.purple{color:#e040fb}
#FX_ROOT_RADIO .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#FX_ROOT_RADIO .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;padding-top:15px;border-top:1px solid #222}
#FX_ROOT_RADIO button{padding:14px;border:0;color:#fff;font-weight:bold;cursor:pointer;border-radius:4px;text-transform:uppercase}
#FX_ROOT_RADIO .update{background:#e6002e}.copy{background:#2f2f33}
#FX_ROOT_RADIO .rsg-viewport{flex:1;display:flex;justify-content:center;align-items:center;background:#050505;position:relative;min-width:0}
#FX_ROOT_RADIO .radio{position:relative;width:min(600px,90%);aspect-ratio:3/2;background:#0a0a0a;border:1px dashed #2c2c2c;overflow:hidden}
#FX_ROOT_RADIO #body{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center;pointer-events:none;z-index:1}
#FX_ROOT_RADIO #arrow{position:absolute;background-size:contain;background-repeat:no-repeat;background-position:top center;pointer-events:none;z-index:2;will-change:transform}
#FX_ROOT_RADIO .knob{position:absolute;border-radius:50%;z-index:4;cursor:grab;pointer-events:auto;background-size:contain;background-position:center;background-repeat:no-repeat;touch-action:none}
#FX_ROOT_RADIO .knob:active{cursor:grabbing}
#FX_ROOT_RADIO #power{position:absolute;border-radius:50%;z-index:6;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;background:transparent;border:none;user-select:none}
#FX_ROOT_RADIO #power.on{color:#00c853;text-shadow:0 0 5px #00c853}
#FX_ROOT_RADIO #led{position:absolute;border-radius:50%;z-index:5;background:#1a1a1a;border:1px solid #333;pointer-events:none}
#FX_ROOT_RADIO #led.on{background:#00e676;box-shadow:0 0 10px #00e676}
#FX_ROOT_RADIO #status{position:absolute;left:0;right:0;bottom:0;z-index:10;background:rgba(0,0,0,.65);padding:4px 12px;font-size:11px;color:#888;display:flex;justify-content:space-between;align-items:center}
#FX_ROOT_RADIO #freq{color:#00e676;font-weight:bold}
#FX_ROOT_RADIO .bars{display:flex;align-items:flex-end;gap:3px;height:16px}.sbar{width:4px;background:#333;border-radius:1px}.sbar.active{background:#00e676}
#FX_ROOT_RADIO #success{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;background:rgba(0,0,0,.94);border:2px solid #ffcc00;border-radius:14px;padding:22px 32px;text-align:center;box-shadow:0 0 35px rgba(255,204,0,.35);transition:.3s}
#FX_ROOT_RADIO #success.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#FX_ROOT_RADIO #success b{display:block;color:#ffcc00;font-size:24px;margin-bottom:7px}
@media(max-width:800px){#FX_ROOT_RADIO .rsg-panel{width:290px;flex-basis:290px;padding:12px}}
</style>

<div class="rsg-panel">
<h2>Мастер Радио-Сигнала</h2>

<label>Изображение корпуса (URL)</label>
<input type="text" data-id="bodyUrl" value="1.png">

<label>Изображение стрелки (URL)</label>
<input type="text" data-id="arrowUrl" value="2.png">

<label>Изображение ручек (URL)</label>
<input type="text" data-id="knobsUrl" value="3.png">

<div class="section-title">1. Калибровка линейной стрелки</div>
<div class="grid">
<div><label>Базовый X (%)</label><input type="number" data-id="posX" value="30" step=".1"></div>
<div><label>Базовый Y (%)</label><input type="number" data-id="posY" value="63" step=".1"></div>
<div><label>Ширина (px)</label><input type="number" data-id="size" value="18"></div>
<div><label>Высота (px)</label><input type="number" data-id="arrowHeight" value="45"></div>
<div><label>Мин. значение (30)</label><input type="number" data-id="minX" value="30"></div>
<div><label>Макс. значение (280)</label><input type="number" data-id="maxX" value="280"></div>
</div>

<label>Тест положения стрелки: <span data-id="testLabel">30</span></label>
<input type="range" data-id="testRot" min="30" max="280" value="30">

<div class="section-title red">2. Левая ручка (Включение / Трек 1)</div>
<div class="grid">
<div><label>X (%)</label><input type="number" data-id="knobSmallX" value="20" step=".1"></div>
<div><label>Y (%)</label><input type="number" data-id="knobSmallY" value="68" step=".1"></div>
</div>
<label>Размер (px)</label><input type="number" data-id="knobSmallSize" value="70">

<div class="section-title blue">3. Правая ручка (Настройка частоты)</div>
<div class="grid">
<div><label>X (%)</label><input type="number" data-id="knobBigX" value="80" step=".1"></div>
<div><label>Y (%)</label><input type="number" data-id="knobBigY" value="68" step=".1"></div>
</div>
<label>Размер (px)</label><input type="number" data-id="knobBigSize" value="70">

<div class="section-title">4. Звуковые файлы</div>
<label>Фоновый фоновый Трек 1 (mp3)</label><input type="text" data-id="noiseFile" value="1.mp3">
<label>Целевой Трек 2 (mp3)</label><input type="text" data-id="signalFile" value="2.mp3">
<label>Целевое значение для Трека 2</label><input type="number" data-id="targetAngle" value="280" step="1">

<div class="section-title green">5. Настройки фона</div>
<label style="display:flex;align-items:center;text-transform:none;color:#aaa">
<input type="checkbox" data-id="transparentBg">Прозрачный фон
</label>
<label>URL кастомного фона</label><input type="text" data-id="customBgUrl" placeholder="https://...">

<div class="section-title purple">6. Индикаторы</div>
<div class="grid">
<div><label>Кнопка X (%)</label><input type="number" data-id="btnX" value="20" step=".1"></div>
<div><label>Кнопка Y (%)</label><input type="number" data-id="btnY" value="68" step=".1"></div>
<div><label>LED X (%)</label><input type="number" data-id="ledX" value="20" step=".1"></div>
<div><label>LED Y (%)</label><input type="number" data-id="ledY" value="60" step=".1"></div>
</div>

<div class="buttons">
<button class="update" data-action="update">Обновить</button>
<button class="copy" data-action="copy">Скопировать</button>
</div>
</div>

<div class="rsg-viewport">
<div class="radio" data-id="radio">
<div id="body"></div>
<div id="arrow"></div>
<div id="volume" class="knob"></div>
<div id="tuning" class="knob"></div>
<div id="power">⏻</div>
<div id="led"></div>
<div id="status">
<span id="freq">30</span>
<span class="bars"><i class="sbar" style="height:5px"></i><i class="sbar" style="height:8px"></i><i class="sbar" style="height:11px"></i><i class="sbar" style="height:14px"></i><i class="sbar" style="height:16px"></i></span>
</div>
<div id="success"><b>СИГНАЛ НАЙДЕН!</b>Играет Трек 2.</div>
</div>
</div>

<audio id="noiseAudio" loop></audio>
<audio id="signalAudio" loop></audio>

<script>
(function(){
'use strict';

const ROOT=document.getElementById('FX_ROOT_RADIO');
if(!ROOT || ROOT.dataset.ready==='1') return;
ROOT.dataset.ready='1';

const $=id=>ROOT.querySelector('[data-id="'+id+'"]')||ROOT.querySelector('#'+id);
const minX=()=>parseFloat($('minX').value)||30;
const maxX=()=>parseFloat($('maxX').value)||280;
const target=()=>parseFloat($('targetAngle').value)||280;

let currentPos=30;
let tuningAngle=0;
let volumeAngle=0;
let powerOn=false;
let drag=null;
let solved=false;

const bars=[...ROOT.querySelectorAll('.sbar')];

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function updateImages(){
  $('body').style.backgroundImage=$('bodyUrl').value.trim()?`url("${$('bodyUrl').value.trim()}")`:'none';
  $('arrow').style.backgroundImage=$('arrowUrl').value.trim()?`url("${$('arrowUrl').value.trim()}")`:'none';
  const u=$('knobsUrl').value.trim();
  ['tuning','volume'].forEach(id=>{$(id).style.backgroundImage=u?`url("${u}")`:'none';});
}

function updateStyles(){
  const box=$('radio'),W=box.clientWidth,H=box.clientHeight;
  const ax=parseFloat($('posX').value)/100*W;
  const ay=parseFloat($('posY').value)/100*H;
  const aw=parseFloat($('size').value)||18;
  const ah=parseFloat($('arrowHeight').value)||45;

  Object.assign($('arrow').style,{
    left:ax+'px',top:ay+'px',width:aw+'px',height:ah+'px'
  });

  $('testRot').min=minX(); $('testRot').max=maxX();
  $('testRot').value=clamp(currentPos,minX(),maxX());

  setKnob('tuning',$('knobBigX'),$('knobBigY'),$('knobBigSize'),W,H);
  setKnob('volume',$('knobSmallX'),$('knobSmallY'),$('knobSmallSize'),W,H);

  const transparent=$('transparentBg').checked;
  const bg=$('customBgUrl').value.trim();
  box.style.background=transparent?'transparent':'#0a0a0a';
  box.style.backgroundImage=!transparent&&bg?`url("${bg}")`:'none';

  const btnSize=parseFloat($('knobSmallSize').value)||70;
  place($('power'),parseFloat($('btnX').value)/100*W-btnSize/2,parseFloat($('btnY').value)/100*H-btnSize/2,btnSize);
  place($('led'),parseFloat($('ledX').value)/100*W-6,parseFloat($('ledY').value)/100*H-6,12);

  render();
}

function setKnob(el,x,y,size,W,H){
  const s=parseFloat(size.value)||50;
  place(el,parseFloat(x.value)/100*W-s/2,parseFloat(y.value)/100*H-s/2,s);
}
function place(el,x,y,w){el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=w+'px';}

function render(){
  const box=$('radio'),W=box.clientWidth;
  const mn=minX(), mx=maxX();
  currentPos=clamp(currentPos, mn, mx);
  
  // Прямолинейный сдвиг в пикселях без поворотов
  const travelPx=(mx-mn)/300*W; 
  const ratio=(currentPos-mn)/(mx-mn||1);
  const shiftX=ratio*travelPx;

  $('arrow').style.transform=`translateX(${shiftX.toFixed(2)}px)`;
  $('tuning').style.transform=`rotate(${tuningAngle}deg)`;
  $('volume').style.transform=`rotate(${volumeAngle}deg)`;
  $('testRot').value=currentPos;
  $('testLabel').textContent=Math.round(currentPos);

  $('freq').textContent=Math.round(currentPos);
  updateBars(currentPos);
  updateAudio(currentPos);
}

function updateBars(pos){
  const d=Math.abs(pos-target());
  const maxD=maxX()-minX();
  const strength=Math.max(0,1-d/(maxD*0.1));
  const level=Math.round(strength*5);
  bars.forEach((b,i)=>b.classList.toggle('active',i<level));
}

function updateAudio(pos){
  if(!powerOn)return;
  const noise=$('noiseAudio'),signal=$('signalAudio');
  const d=Math.abs(pos-target());
  const tolerance=10;

  if(d<=tolerance){
    const sig=Math.pow(1-d/tolerance,2);
    noise.volume=(1-sig);
    signal.volume=sig;
    if(sig>0.05 && signal.paused)signal.play().catch(()=>{});
    if(d<=2)win();
  }else{
    signal.pause(); signal.volume=0;
    noise.volume=1;
  }
}

function togglePower(){
  powerOn=!powerOn;
  $('power').classList.toggle('on',powerOn);
  $('led').classList.toggle('on',powerOn);

  const n=$('noiseAudio'),s=$('signalAudio');
  if(powerOn){
    n.src=$('noiseFile').value.trim();
    s.src=$('signalFile').value.trim();
    n.volume=1; s.volume=0;
    n.play().catch(()=>{});
    render();
  }else{
    n.pause();s.pause();n.volume=0;s.volume=0;
  }
}

function pointerAngle(e,el){
  const r=el.getBoundingClientRect();
  const x=e.clientX??e.touches?.[0]?.clientX??0;
  const y=e.clientY??e.touches?.[0]?.clientY??0;
  return Math.atan2(y-(r.top+r.height/2),x-(r.left+r.width/2))*180/Math.PI;
}

function beginDrag(e,type){
  e.preventDefault();
  const el=$(type==='tuning'?'tuning':'volume');
  drag={type,start:pointerAngle(e,el),angle:type==='tuning'?tuningAngle:volumeAngle,moved:false};
  if(e.pointerId!=null)el.setPointerCapture?.(e.pointerId);
}

function moveDrag(e){
  if(!drag)return;
  e.preventDefault();
  const el=$(drag.type==='tuning'?'tuning':'volume');
  let d=pointerAngle(e,el)-drag.start;
  if(d>180)d-=360;if(d<-180)d+=360;

  if(Math.abs(d)>2) drag.moved=true;

  if(drag.type==='tuning'){
    tuningAngle+=d;
    drag.start=pointerAngle(e,el);
    currentPos=clamp(currentPos+d*0.3, minX(), maxX());
  }else{
    volumeAngle+=d;
    drag.start=pointerAngle(e,el);
  }
  render();
}

function endDrag(){
  if(drag && drag.type==='volume' && !drag.moved){
    togglePower();
  }
  drag=null;
}

function win(){
  if(solved)return;
  solved=true;
  $('success').classList.add('show');
}

['tuning','volume'].forEach(type=>{
  const el=$(type);
  el.addEventListener('pointerdown',e=>beginDrag(e,type));
  el.addEventListener('pointermove',moveDrag);
  el.addEventListener('pointerup',endDrag);
  el.addEventListener('pointercancel',endDrag);
  el.addEventListener('wheel',e=>{
    e.preventDefault();
    const step=e.deltaY<0?4:-4;
    if(type==='tuning'){
      tuningAngle+=step*5;
      currentPos=clamp(currentPos+step, minX(), maxX());
    }else{
      volumeAngle+=step*5;
    }
    render();
  },{passive:false});
});

$('power').addEventListener('click',togglePower);

$('testRot').addEventListener('input',()=>{
  currentPos=parseFloat($('testRot').value);
  render();
});

ROOT.querySelectorAll('input').forEach(el=>{
  el.addEventListener('input',()=>{updateImages();updateStyles();});
  el.addEventListener('change',()=>{updateImages();updateStyles();});
});

$('noiseFile').addEventListener('change',()=>{if(powerOn)$('noiseAudio').src=$('noiseFile').value.trim();});
$('signalFile').addEventListener('change',()=>{if(powerOn)$('signalAudio').src=$('signalFile').value.trim();});

ROOT.querySelector('[data-action="update"]').addEventListener('click',()=>{updateImages();updateStyles();});
ROOT.querySelector('[data-action="copy"]').addEventListener('click',()=>{
  const cfg={
    body:$('bodyUrl').value,arrow:$('arrowUrl').value,knobs:$('knobsUrl').value,
    arrowParams:{x:$('posX').value,y:$('posY').value,size:$('size').value,height:$('arrowHeight').value,minX:$('minX').value,maxX:$('maxX').value},
    tuning:{x:$('knobBigX').value,y:$('knobBigY').value,size:$('knobBigSize').value},
    volume:{x:$('knobSmallX').value,y:$('knobSmallY').value,size:$('knobSmallSize').value},
    audio:{noise:$('noiseFile').value,signal:$('signalFile').value,target:$('targetAngle').value}
  };
  navigator.clipboard?.writeText(JSON.stringify(cfg,null,2)).then(()=>alert('Конфигурация скопирована!'));
});

updateImages();
updateStyles();
})();
</script>
</div>
